<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Résidence Les Oliviers — Wireframe 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#f4f4f1;font-family:Arial,Helvetica,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.drag{cursor:grabbing}
.ui{position:fixed;z-index:2;background:rgba(255,255,255,.92);border:1px solid #222;padding:12px 16px}
.top{left:22px;top:22px}.title{font-size:19px;font-weight:700}.sub{font-size:12px;color:#666;margin-top:6px}
.legend{right:22px;bottom:22px;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui top"><div class="title">PLAN DE MASSE — VUE 3D WIREFRAME</div><div class="sub">Souris : rotation • molette : zoom • glisser : déplacement • Scroll : visite</div></div>
<div class="ui legend">BLOC A · B · C · D · E</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,dpr,scale=6.2,yaw=-.55,pitch=.82,panX=0,panY=10;
let drag=false,lx=0,ly=0,visit=0;

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
addEventListener('resize',resize);

function P(x,y,z){
  // camera-style axonometric projection
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const X=x*cy-z*sy, Z=x*sy+z*cy;
  const Y=y*cp-Z*sp;
  return {x:W/2+panX+X*scale,y:H/2+panY-Y*scale};
}
function line(a,b,col='#555',lw=1){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.stroke()}
function poly(points,col='#555',lw=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.stroke()}
function box(x,z,w,d,h,col='#333'){
  const b=[P(x-w/2,0,z-d/2),P(x+w/2,0,z-d/2),P(x+w/2,0,z+d/2),P(x-w/2,0,z+d/2)];
  const t=b.map(q=>P((q.x-W/2-panX)/scale, h, (q.y-H/2-panY)/scale)); // not usable inverse
}
function cube(x,z,w,d,h,col='#333'){
  const q=[
    P(x-w/2,0,z-d/2),P(x+w/2,0,z-d/2),P(x+w/2,0,z+d/2),P(x-w/2,0,z+d/2),
    P(x-w/2,h,z-d/2),P(x+w/2,h,z-d/2),P(x+w/2,h,z+d/2),P(x-w/2,h,z+d/2)
  ];
  [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(e=>line(q[e[0]],q[e[1]],col,1));
}
function floorBands(x,z,w,d,h){
  for(let y=3;y<h-1;y+=3){
    line(P(x-w/2,y,z-d/2),P(x+w/2,y,z-d/2),'#999');
    line(P(x-w/2,y,z+d/2),P(x+w/2,y,z+d/2),'#999');
  }
}
function label(txt,x,y,z){
  const p=P(x,y,z);ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  const m=ctx.measureText(txt),ww=m.width+18,hh=24;
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(p.x-ww/2,p.y-hh/2,ww,hh);
  ctx.strokeStyle='#222';ctx.strokeRect(p.x-ww/2,p.y-hh/2,ww,hh);
  ctx.fillStyle='#111';ctx.fillText(txt,p.x,p.y);
}
function tree(x,z,s=1){
  const base=P(x,0,z), top=P(x,3*s,z);
  line(base,top,'#60705d',1.2);
  const c=P(x,5*s,z),r=2.3*s;
  // projected circular crown
  ctx.beginPath();ctx.ellipse(c.x,c.y,r*scale*.72,r*scale*.72,0,0,Math.PI*2);ctx.strokeStyle='#60705d';ctx.lineWidth=1;ctx.stroke();
  for(let i=0;i<8;i++){let a=i*Math.PI/4;line(c,P(x+Math.cos(a)*r,5*s,z+Math.sin(a)*r),'#8a9486')}
}
function car(x,z,ang=0){
  const w=3.4,d=6.5,h=1.5;
  const pts=[[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2]].map(([a,b])=>[x+a*Math.cos(ang)-b*Math.sin(ang),z+a*Math.sin(ang)+b*Math.cos(ang)]);
  poly(pts.map(q=>P(q[0],0,q[1])),'#777');
  const top=pts.map(q=>P(q[0],h,q[1]));poly(top,'#777');
  for(let i=0;i<4;i++)line(P(pts[i][0],0,pts[i][1]),top[i],'#777');
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // site boundary
  poly([P(-78,0,-38),P(78,0,-38),P(78,0,39),P(-78,0,39)],'#777',1.3);
  // road
  poly([P(-90,0,40),P(90,0,40),P(90,0,62),P(-90,0,62)],'#555',1.2);
  for(let x=-82;x<82;x+=12)line(P(x,0,51),P(x+6,0,51),'#999',1);
  label('Rue',0,.2,52);

  // internal circulation
  poly([P(-69,.1,18),P(69,.1,18),P(69,.1,28),P(-69,.1,28)],'#888');
  poly([P(-5,.1,18),P(5,.1,18),P(5,.1,39),P(-5,.1,39)],'#888');

  const blocks=[
    ['BLOC A',-55,-5,25,34,24],
    ['BLOC B',-25,-6,31,31,29],
    ['BLOC C',5,-6,31,31,31],
    ['BLOC D',35,-5,29,32,30],
    ['BLOC E',58,9,27,29,25]
  ];
  blocks.forEach(b=>{
    const [name,x,z,w,d,h]=b;
    cube(x,z,w,d,h,'#333');floorBands(x,z,w,d,h);
    // balconies/front projections
    for(let y=5;y<h-1;y+=5){
      const zz=z+d/2+1.7;
      line(P(x-w*.32,y,zz),P(x+w*.32,y,zz),'#777');
      line(P(x-w*.32,y+1.4,zz),P(x+w*.32,y+1.4,zz),'#aaa');
      line(P(x-w*.32,y,zz),P(x-w*.32,y+1.4,zz),'#888');
      line(P(x+w*.32,y,zz),P(x+w*.32,y+1.4,zz),'#888');
    }
    label(name,x,h+3,z);
  });

  // rooftop outlines
  blocks.forEach(b=>{const [n,x,z,w,d,h]=b;poly([P(x-w/2,h,z-d/2),P(x+w/2,h,z-d/2),P(x+w/2,h,z+d/2),P(x-w/2,h,z+d/2)],'#222',1.3)});

  // parking
  [-43,-33,-23,18,28,38,49].forEach(x=>{
    poly([P(x-4,0,30),P(x+4,0,30),P(x+4,0,41),P(x-4,0,41)],'#aaa');
    car(x,35,0);
  });
  // trees
  [[-72,-34,1],[-54,-34,.8],[-37,-34,.9],[-10,-34,1],[16,-34,.8],[43,-34,.9],[70,-34,1],
   [-75,-24,.8],[-45,12,.8],[-13,11,.8],[18,11,.8],[46,15,.8],[74,0,1],[-77,5,.8],[70,25,.9],
   [-20,25,.7],[25,25,.8]].forEach(t=>tree(...t));

  // playground rings
  [8,13,17].forEach(r=>{
    const pts=[];for(let i=0;i<=64;i++){let a=i*Math.PI*2/64;pts.push(P(70+r*Math.cos(a),.15,-5+r*Math.sin(a)))}poly(pts,'#777');
  });
  cube(70,-5,5,5,4,'#777');
  line(P(67,4,-7),P(73,4,-3),'#777');line(P(73,4,-7),P(67,4,-3),'#777');

  // north arrow
  line(P(-79,0,-42),P(-79,8,-42),'#222',1.5);label('N',-79,10,-42);
}
canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.classList.add('drag')});
addEventListener('mouseup',()=>{drag=false;canvas.classList.remove('drag')});
addEventListener('mousemove',e=>{if(!drag)return; yaw+=(e.clientX-lx)*.006; pitch=Math.max(.35,Math.min(1.25,pitch+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY;draw()});
canvas.addEventListener('wheel',e=>{e.preventDefault();scale*=Math.exp(-e.deltaY*.001);scale=Math.max(3,Math.min(11,scale));visit=Math.max(0,Math.min(1,visit+e.deltaY*.0005));draw()},{passive:false});
resize();
</script>
</body>
</html>
